{% extends 'base.html' %}

{% block content %}
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-sm border-0" style="border-radius: 20px; background-color: var(--bg-header-footer);">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-box-arrow-in-right text-primary" style="font-size: 3rem;"></i>
                        <h3 class="fw-bold mt-2" style="color: var(--text-color);">Tizimga kirish</h3>
                        <p class="small" style="color: var(--text-color); opacity: 0.7;">Davom etish uchun o'z hisobingizga kiring</p>
                    </div>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3" style="color: var(--text-color);">
                            {{ form.as_p }}
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mt-3" style="border-radius: 12px;">
                            KIRISH
                        </button>
                    </form>
                    <div class="mt-4 pt-3 border-top border-secondary text-center">
                        <p class="text-muted small">
                            Profilingiz yo'qmi? 
                            <a href="{% url 'register' %}" class="text-primary fw-bold text-decoration-none">Ro'yxatdan o'ting</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
