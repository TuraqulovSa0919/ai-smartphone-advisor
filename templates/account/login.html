{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap');

.login-wrap { min-height: unset; display:flex; align-items:center; justify-content:center; padding:2rem 1rem; position:relative; overflow:hidden; background: var(--bg-body); }
.login-wrap::before { content:''; position:absolute; width:340px; height:340px; border-radius:50%; background:#dbeafe; opacity:.25; top:-80px; right:-80px; pointer-events:none; }
.login-wrap::after  { content:''; position:absolute; width:200px; height:200px; border-radius:50%; background:#fef3c7; opacity:.2; bottom:-40px; left:-40px; pointer-events:none; }

.login-card { background:var(--bg-header-footer); border:1px solid rgba(0,0,0,.08); border-radius:20px; padding:2.5rem 2rem; width:100%; max-width:400px; z-index:1; position:relative; }

.brand-mark { display:flex; align-items:center; gap:10px; margin-bottom:2rem; }
.brand-icon  { width:40px; height:40px; border-radius:10px; background:#dbeafe; display:flex; align-items:center; justify-content:center; }
.brand-icon i { font-size:20px; color:#1d4ed8; }
.brand-name   { font-family:'DM Serif Display',serif; font-size:18px; color:var(--text-color); }

.login-heading { font-family:'DM Serif Display',serif; font-size:26px; font-weight:400; color:var(--text-color); margin:0 0 6px; letter-spacing:-.5px; }
.login-sub     { font-size:13.5px; color:var(--text-color); opacity:.6; margin:0 0 1.75rem; font-family:'DM Sans',sans-serif; }

.field-group { margin-bottom:1rem; }
.field-label  { font-size:12px; font-weight:500; letter-spacing:.6px; text-transform:uppercase; color:var(--text-color); opacity:.65; display:block; margin-bottom:6px; font-family:'DM Sans',sans-serif; }

/* Django form.as_p input styling */
.login-form p { margin:0 0 1rem; }
.login-form label { font-size:12px; font-weight:500; letter-spacing:.6px; text-transform:uppercase; color:var(--text-color); opacity:.65; display:block; margin-bottom:6px; font-family:'DM Sans',sans-serif; }
.login-form input[type=text],
.login-form input[type=password] { width:100%; box-sizing:border-box; height:44px; padding:0 14px; background:rgba(0,0,0,.04); border:1px solid rgba(0,0,0,.1); border-radius:10px; font-size:14px; color:var(--text-color); outline:none; transition:border-color .15s, box-shadow .15s; font-family:'DM Sans',sans-serif; }
.login-form input:focus { border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,.15); }

.submit-btn { width:100%; height:46px; margin-top:1.25rem; background:var(--text-color); color:var(--bg-header-footer); border:none; border-radius:10px; font-size:14px; font-weight:500; letter-spacing:.5px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; transition:opacity .15s; font-family:'DM Sans',sans-serif; }
.submit-btn:hover { opacity:.8; }

.divider { display:flex; align-items:center; gap:12px; margin:1.5rem 0 1rem; }
.divider-line { flex:1; height:1px; background:rgba(0,0,0,.08); }
.divider-text { font-size:11px; color:var(--text-color); opacity:.4; letter-spacing:.5px; text-transform:uppercase; font-family:'DM Sans',sans-serif; }

.register-row { text-align:center; font-size:13px; color:var(--text-color); opacity:.7; font-family:'DM Sans',sans-serif; }
.register-row a { color:#3b82f6; font-weight:500; text-decoration:none; opacity:1; }
</style>

<div class="login-wrap">
  <div class="login-card">
     <div class="brand-mark">
     <div class="brand-icon">
    <img src="{% static 'images/logo.png' %}" alt="Logo" style="width:24px; height:24px; object-fit:contain;">
  </div>
  <span class="brand-name">AI Phone Advisor</span>
</div>

    <h1 class="login-heading">Xush kelibsiz</h1>
    <p class="login-sub">Davom etish uchun hisobingizga kiring</p>

    <form method="post" class="login-form">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="submit-btn">
        Kirish <i class="bi bi-arrow-right"></i>
      </button>
    </form>

    <div class="divider">
      <span class="divider-line"></span>
      <span class="divider-text">yoki</span>
      <span class="divider-line"></span>
    </div>

    <p class="register-row">
      Hisobingiz yo'qmi?
      <a href="{% url 'register' %}">Ro'yxatdan o'ting</a>
    </p>
  </div>
</div>
{% endblock %}
